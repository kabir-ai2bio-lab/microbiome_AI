# 16S config for PRJNA611839 (Shanghai, China; AD vs NC).
# Dataset #4 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 21 AD / 44 NC = 65, V3-V4, paired.
#
# LABELS NEEDED: the NCBI metadata of this project has no diagnosis. Create
# labels/PRJNA611839.csv with columns Run,Diagnosis (AD or NC) for the 65 runs, taken from the
# original publication or its authors. The pipeline stops with a clear message until the file exists.

project: PRJNA611839

expected:
  runs: 65
  groups: {AD: 21, NC: 44}

labels:
  file: labels/PRJNA611839.csv
  join_column: Run
  source_column: Diagnosis
  unique_column: SampleName      # one run per sample
  regex: '^(AD|NC)$'

selection_seed: 20261011

modes:
  dry-run: {n_samples: 2, subsample_pairs: 5000, n_reads_learn: 10000}
  validation: {n_samples: 10}
  full: {}

# Verified in raw reads (2 x 301): 338F on R1 and 806R on R2, each after a 6 bp spacer (as PRJNA554111).
primers:
  r1: ACTCCTACGGGAGGCAGCAG     # 338F
  r2: GGACTACHVGGGTWTCTAAT     # 806R

cutadapt: {error_rate: 0.1, min_overlap: 15}

dada2:
  truncation: figaro
  max_ee_f: 4
  max_ee_r: 6
  n_reads_learn: 100000

expected_insert_upper: 429
min_paired_overlap: 20

qc: {min_cutadapt_retained: 0.80, min_trunc_eligible: 0.95, min_dada2_retained_pct: 20}
reference: {silva_version: "138", silva_target: SSURef_NR99}
vsearch: {identity: 0.90, query_coverage: 0.80, maxaccepts: 10}
genus_filter: {min_samples_present: 2, min_corpus_fraction: 0.00001}

figaro: {amplicon_length: 429, forward_primer_length: 26, reverse_primer_length: 26, min_overlap: 20}

download: {max_size: 20G, parallel_jobs: 4, delete_sra_after_fastq: true}

warnings:
  - Labels supplied by the user (labels/PRJNA611839.csv), not from NCBI

# 16S config for PRJEB51982 (Wisconsin, USA; AD vs NC).
# Dataset #12 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 25 AD / 25 NC, V4, paired.
# Diagnosis is in the BioSample attribute "host disease status" (AD / Control).

project: PRJEB51982
biosample_attributes: true

expected:
  runs: 50
  groups: {AD: 25, NC: 25}

labels:
  source_column: host disease status
  regex: '^(AD|Control)$'
  map: {Control: NC}
  unique_column: SampleName

selection_seed: 20261011

modes:
  dry-run: {n_samples: 2, subsample_pairs: 5000, n_reads_learn: 10000}
  validation: {n_samples: 10}
  full: {}

# Verified in raw reads (2 x 251): R1 starts TACG..., R2 starts CCTGTTTG..., i.e. right after the
# 515F / 806R primers (EMP V4). No primers in the reads, so Cutadapt is skipped.
# Reference numbers of the committed results. A run that matches logs
# REPRODUCIBILITY CHECK PASSED (the pipeline is deterministic for identical input).
expected_results:
  full:                        # 2026-11-09 run, QIIME 2 2026.7, FIGARO trunc 126/147, maxEE 1/2; = results/PRJEB51982/full
    asvs: 2849
    total_input: 7494272
    total_non_chimeric: 6431397

primers: null

cutadapt: {error_rate: 0.1, min_overlap: 15}

dada2:
  truncation: figaro           # truncation lengths + maxEE = FIGARO's best choice, as in the paper
  max_ee_f: 4
  max_ee_r: 6
  n_reads_learn: 100000

expected_insert_upper: 253     # 515F-806R insert without primers
min_paired_overlap: 20

qc: {min_cutadapt_retained: 0.80, min_trunc_eligible: 0.95, min_dada2_retained_pct: 20}
reference: {silva_version: "138", silva_target: SSURef_NR99}
vsearch: {identity: 0.90, query_coverage: 0.80, maxaccepts: 10}
genus_filter: {min_samples_present: 2, min_corpus_fraction: 0.00001}

figaro: {amplicon_length: 253, forward_primer_length: 0, reverse_primer_length: 0, min_overlap: 20}

download: {max_size: 20G, parallel_jobs: 4, delete_sra_after_fastq: true}

warnings:
  - Labels from the BioSample attribute "host disease status"; not clinically verified

# 16S config for PRJNA792014 (Shandong, China; AD vs NC).
# Dataset #7 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 13 AD / 13 NC, V3-V4, paired.
# Diagnosis is in the BioSample attribute "isolate" ("Alzheimer's disease" / "Normal control").

project: PRJNA792014
biosample_attributes: true

expected:
  runs: 26
  groups: {AD: 13, NC: 13}

labels:
  source_column: isolate
  patterns: {AD: "^Alzheimer", NC: "^Normal control$"}
  unique_column: SampleName

selection_seed: 20261011

modes:
  dry-run: {n_samples: 2, subsample_pairs: 5000, n_reads_learn: 10000}
  validation: {n_samples: 10}
  full: {}

# Verified in raw reads (2 x 250): R1 = sample barcode (7-10 bp) + 338F; R2 = 806R at position 0.
# Reference numbers of the committed results. A run that matches logs
# REPRODUCIBILITY CHECK PASSED (the pipeline is deterministic for identical input).
expected_results:
  full:                        # 2026-11-09 run, QIIME 2 2026.7, FIGARO trunc 218/223, maxEE 2/1; = results/PRJNA792014/full
    asvs: 2067
    total_input: 994192
    total_non_chimeric: 561321

primers:
  r1: ACTCCTACGGGAGGCAGCAG     # 338F
  r2: GGACTACHVGGGTWTCTAAT     # 806R

cutadapt: {error_rate: 0.1, min_overlap: 15}

dada2:
  truncation: figaro           # truncation lengths + maxEE = FIGARO's best choice, as in the paper
  max_ee_f: 4                  # max_ee_* are used only with 'truncation: config'
  max_ee_r: 6
  n_reads_learn: 100000

expected_insert_upper: 429     # 338F-806R insert
min_paired_overlap: 12         # 2 x 250 leaves ~20 bp overlap after primer removal; DADA2 needs 12

qc: {min_cutadapt_retained: 0.80, min_trunc_eligible: 0.95, min_dada2_retained_pct: 20}
reference: {silva_version: "138", silva_target: SSURef_NR99}
vsearch: {identity: 0.90, query_coverage: 0.80, maxaccepts: 10}
genus_filter: {min_samples_present: 2, min_corpus_fraction: 0.00001}

figaro:                        # forward length = longest barcode (11) + primer (20)
  amplicon_length: 429
  forward_primer_length: 31
  reverse_primer_length: 20
  min_overlap: 12

download: {max_size: 20G, parallel_jobs: 4, delete_sra_after_fastq: true}

warnings:
  - Labels from the BioSample attribute "isolate"; not clinically verified

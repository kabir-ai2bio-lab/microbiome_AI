# 16S amplicon preprocessing config for PRJNA770746 (Vancouver, Canada; AD vs NC).
# Dataset #14 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 45 AD / 54 NC, V4, paired.
#
# The BioProject holds 198 runs: 99 stool (isolation_source "feces", SampleName FECAL*) and 99
# oral-cavity samples (ORAL*) from the same participants. The paper analyzed gut microbiota, so
# only the 99 stool runs are used, which matches Table 1 exactly (45 AD / 54 NC). Diagnosis is
# stored only in the BioSample attribute "disease" (AD / Control).

project: PRJNA770746

biosample_attributes: true     # fetch BioSample attributes (disease, isolation_source)

include:                       # keep stool, drop the 99 oral-cavity runs
  isolation_source: feces

expected:
  paired_runs: 99
  groups: {AD: 45, NC: 54}

labels:
  source_column: disease       # BioSample attribute
  regex: '^(AD|Control)$'
  map: {Control: NC}
  unique_column: SampleName    # FECAL<n>, one per participant

selection_seed: 20261011

modes:
  dry-run:
    n_samples: 2               # one AD + one NC
    subsample_pairs: 5000
    n_reads_learn: 10000
  validation:
    n_samples: 10
  full: {}

# Verified in raw reads: R1 starts at TACG... and R2 at CCTGTTTG..., i.e. right after the 515F / 806R
# primers (EMP V4 protocol). The primers are not part of the reads, so Cutadapt is skipped.
# Reference numbers of the committed results. A run that matches logs
# REPRODUCIBILITY CHECK PASSED (the pipeline is deterministic for identical input).
expected_results:
  full:                        # 2026-11-09 run, QIIME 2 2026.7, FIGARO trunc 159/114, maxEE 1/1; = results/PRJNA770746/full
    asvs: 4136
    total_input: 3074608
    total_non_chimeric: 2202921

primers: null

cutadapt:
  error_rate: 0.1
  min_overlap: 15

dada2:                         # 2 x 251 bp reads; V4 insert ~253 bp
  truncation: figaro           # truncation lengths + maxEE = FIGARO's best choice, as in the paper
  max_ee_f: 4                  # max_ee_* are used only with 'truncation: config'
  max_ee_r: 6
  n_reads_learn: 100000

expected_insert_upper: 253     # 515F-806R insert without primers
min_paired_overlap: 20

qc:
  min_cutadapt_retained: 0.80
  min_trunc_eligible: 0.95
  min_dada2_retained_pct: 20

reference:
  silva_version: "138"
  silva_target: SSURef_NR99

vsearch:
  identity: 0.90
  query_coverage: 0.80
  maxaccepts: 10

genus_filter:
  min_samples_present: 2
  min_corpus_fraction: 0.00001

figaro:                        # no primers in the reads
  amplicon_length: 253
  forward_primer_length: 0
  reverse_primer_length: 0
  min_overlap: 20

download:
  max_size: 20G
  parallel_jobs: 4
  delete_sra_after_fastq: true

warnings:
  - Labels from the BioSample attribute "disease" (AD / Control); not clinically verified
  - Oral-cavity runs (ORAL*) from the same participants are excluded
  - Single BioProject; cross-study batch correction happens after merging

# 16S config for PRJNA734525 (Istanbul, Turkey), sequencing batch 1 of 2.
# Dataset #11 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 47 AD / 27 MCI / 51 NC = 125, V3-V4, paired.
#
# The project was sequenced in two batches with different read lengths, so DADA2 runs per batch
# (as DADA2 recommends) and the genus tables are merged afterwards:
#   batch 1 (this file): SampleName AD* 17, MCI* 27, C* 18   -> 2 x ~232 bp
#   batch 2:             SampleName ADH* 30, CK* 33          -> 2 x ~281 bp
# Together: AD 17+30 = 47, MCI 27, NC 18+33 = 51, as in the paper.

project: PRJNA734525
dataset: PRJNA734525_batch1

include_regex:
  SampleName: '^(AD|MCI|C)\d'

expected:
  runs: 62
  groups: {AD: 17, MCI: 27, NC: 18}

labels:
  source_column: SampleName
  patterns: {AD: '^AD\d', MCI: '^MCI\d', NC: '^C\d'}

selection_seed: 20261011

modes:
  dry-run: {n_samples: 3, subsample_pairs: 5000, n_reads_learn: 10000}
  validation: {n_samples: 10}
  full: {}

# Verified in raw reads: R1 starts TGGGGAATATTG... (after 341F), R2 TGTTTGCTCC... (after 805R).
# Primers were already removed, so Cutadapt is skipped.
primers: null

cutadapt: {error_rate: 0.1, min_overlap: 15}

dada2:
  truncation: figaro           # truncation lengths + maxEE = FIGARO's best choice, as in the paper
  max_ee_f: 4
  max_ee_r: 6
  n_reads_learn: 100000

expected_insert_upper: 427     # 341F-805R insert without primers
min_paired_overlap: 20

qc: {min_cutadapt_retained: 0.80, min_trunc_eligible: 0.95, min_dada2_retained_pct: 20}
reference: {silva_version: "138", silva_target: SSURef_NR99}
vsearch: {identity: 0.90, query_coverage: 0.80, maxaccepts: 10}
genus_filter: {min_samples_present: 2, min_corpus_fraction: 0.00001}

figaro: {amplicon_length: 427, forward_primer_length: 0, reverse_primer_length: 0, min_overlap: 20}

download: {max_size: 20G, parallel_jobs: 4, delete_sra_after_fastq: true}

warnings:
  - Labels inferred from SampleName prefixes (AD / MCI / C); not clinically verified
  - Batch 1 of 2; merge with PRJNA734525_batch2 at genus level

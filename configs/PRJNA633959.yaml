# 16S amplicon preprocessing config for PRJNA633959 (Lishui, China; AD vs NC).
# Dataset #2 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 100 AD / 71 NC, V3-V4, paired.

project: PRJNA633959

expected:
  paired_runs: 171
  groups: {AD: 100, NC: 71}

labels:                        # LibraryName is AD<n>.fq / C<n>.fq (all runs share one BioSample)
  source_column: LibraryName
  regex: '^(AD|C)\d+\.fq$'
  map: {C: NC}

selection_seed: 20261011

modes:
  dry-run:
    n_samples: 2               # one AD + one NC
    subsample_pairs: 5000
    n_reads_learn: 10000
  validation:
    n_samples: 10
  full: {}

primers:                       # verified in raw reads: 341F on R1, 805R on R2, at position 0
  r1: CCTACGGGNGGCWGCAG        # 341F
  r2: GACTACHVGGGTATCTAATCC    # 805R

# Reference numbers (2026-11-02, QIIME 2 2026.7, FIGARO trunc 265/184, maxEE 2/2).
expected_results:
  dry-run:
    asvs: 95
    non_chimeric: {SRR11825939: 2653, SRR11825990: 1981}
  full:                        # 2026-11-09 run, QIIME 2 2026.7, FIGARO trunc 252/197, maxEE 2/3; = results/PRJNA633959/full
    asvs: 4620
    total_input: 8345750
    total_non_chimeric: 4170317

cutadapt:
  error_rate: 0.1
  min_overlap: 15

dada2:                         # post-Cutadapt coordinates (2 x ~297 bp reads, ~278 bp after trimming)
  truncation: figaro           # truncation lengths + maxEE = FIGARO's best choice, as in the paper
  max_ee_f: 4                  # max_ee_* are used only with 'truncation: config'
  max_ee_r: 6
  n_reads_learn: 100000

expected_insert_upper: 429     # 341F-805R insert (~425-430 bp)
min_paired_overlap: 20

qc:
  min_cutadapt_retained: 0.80
  min_trunc_eligible: 0.95
  min_dada2_retained_pct: 20

reference:
  silva_version: "138"
  silva_target: SSURef_NR99

vsearch:
  identity: 0.90
  query_coverage: 0.80
  maxaccepts: 10

genus_filter:
  min_samples_present: 2
  min_corpus_fraction: 0.00001

figaro:
  amplicon_length: 429
  forward_primer_length: 17
  reverse_primer_length: 21
  min_overlap: 20

download:
  max_size: 20G
  parallel_jobs: 4
  delete_sra_after_fastq: true

warnings:
  - Labels inferred from NCBI LibraryName prefixes (AD / C); not clinically verified
  - Single BioProject; cross-study batch correction happens after merging

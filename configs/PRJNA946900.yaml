# 16S config for PRJNA946900 (Beijing, China; AD / MCI / NC).
# Dataset #6 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 225 AD / 38 MCI / 175 NC = 438, V4-V5, paired.
# All 438 runs are used, as in the paper. Diagnosis is in the BioSample title
# ("Alzheimer's Disease (AD)", "Mild Cognitive Impairment (MCI)", "Normal healthy Control (NC)").

project: PRJNA946900
biosample_attributes: true

expected:
  runs: 438
  groups: {AD: 225, MCI: 38, NC: 175}

labels:
  source_column: bs_title
  patterns: {AD: "^Alzheimer", MCI: "^Mild Cognitive", NC: "^Normal healthy"}
  unique_column: SampleName

selection_seed: 20261011

modes:
  dry-run: {n_samples: 3, subsample_pairs: 5000, n_reads_learn: 10000}
  validation: {n_samples: 10}
  full: {}

# Verified in raw reads (2 x 238): 515F-Y and 926R at position 0, but in MIXED orientation (about half
# of the pairs have 926R on read 1). reorient swaps those mates first, so Cutadapt keeps them.
primers:
  r1: GTGYCAGCMGCCGCGGTAA      # 515F-Y
  r2: CCGYCAATTYMTTTRAGTTT     # 926R
  max_offset: 2
reorient: true

cutadapt: {error_rate: 0.1, min_overlap: 15}

dada2:
  truncation: figaro           # truncation lengths + maxEE = FIGARO's best choice, as in the paper
  max_ee_f: 4
  max_ee_r: 6
  n_reads_learn: 100000

expected_insert_upper: 380     # 515F-926R insert (~373 bp)
min_paired_overlap: 20

qc: {min_cutadapt_retained: 0.80, min_trunc_eligible: 0.95, min_dada2_retained_pct: 20}
reference: {silva_version: "138", silva_target: SSURef_NR99}
vsearch: {identity: 0.90, query_coverage: 0.80, maxaccepts: 10}
genus_filter: {min_samples_present: 2, min_corpus_fraction: 0.00001}

figaro: {amplicon_length: 380, forward_primer_length: 19, reverse_primer_length: 20, min_overlap: 20}

download: {max_size: 20G, parallel_jobs: 4, delete_sra_after_fastq: true}

warnings:
  - Labels from the BioSample title; not clinically verified
  - Some participants appear to have two samples (e.g. A01-1, A01-2); all 438 runs are used, as in the paper

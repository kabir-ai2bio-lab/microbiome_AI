# 16S config for PRJNA855571 (Fujian, China; AD vs NC).
# Dataset #8 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 125 AD / 40 NC, V3-V4, single.
#
# The project has 336 runs: 165 gut (feces) and 171 oral (plaque). Only the 165 gut runs are used,
# which matches the paper. SampleName: F<n> / A<n>F<n> = AD (93 + 32 = 125), NCF<n> = NC (40).

project: PRJNA855571
layout: single

include:
  ScientificName: human gut metagenome

expected:
  runs: 165
  groups: {AD: 125, NC: 40}

labels:
  source_column: SampleName
  patterns: {NC: '^NCF\d+$', AD: '^(A\d+)?F\d+$'}

selection_seed: 20261011

modes:
  dry-run: {n_samples: 2, subsample_pairs: 5000, n_reads_learn: 10000}
  validation: {n_samples: 10}
  full: {}

# Verified in raw reads: single reads of 440-470 bp (merged pairs) starting with 341F and ending with
# the reverse-complemented 805R; both are removed (degenerate primer bases would create false ASVs).
# Reference numbers of the committed results. A run that matches logs
# REPRODUCIBILITY CHECK PASSED (the pipeline is deterministic for identical input).
expected_results:
  full:                        # 2026-11-09 run, QIIME 2 2026.7, single-end, config truncation; = results/PRJNA855571/full
    asvs: 9011
    total_input: 13631924
    total_non_chimeric: 8057603

primers:
  r1: CCTACGGGNGGCWGCAG          # 341F
  r1_3prime: GGATTAGATACCCBDGTAGTC  # reverse complement of 805R

cutadapt: {error_rate: 0.1, min_overlap: 15}

dada2:                         # FIGARO needs paired-end reads; merged reads are kept at full length
  truncation: config
  trunc_f: 0
  max_ee_f: 2
  max_ee_r: 2                  # unused (single-end)
  n_reads_learn: 100000

expected_insert_upper: 430
min_paired_overlap: 0

qc: {min_cutadapt_retained: 0.80, min_trunc_eligible: 0.95, min_dada2_retained_pct: 20}
reference: {silva_version: "138", silva_target: SSURef_NR99}
vsearch: {identity: 0.90, query_coverage: 0.80, maxaccepts: 10}
genus_filter: {min_samples_present: 2, min_corpus_fraction: 0.00001}

download: {max_size: 20G, parallel_jobs: 4, delete_sra_after_fastq: true}

warnings:
  - Labels inferred from SampleName prefixes (F / AxF = AD, NCF = NC); not clinically verified
  - Oral (plaque) runs of the same project are excluded
  - Pre-merged single-end reads, so FIGARO is not used

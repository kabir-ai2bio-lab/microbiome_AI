# 16S config for PRJNA801673 (Chicago, IL, USA; MCI vs NC).
# Dataset #13 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 30 MCI / 30 NC = 60, V4, paired.
#
# NCBI has no diagnosis. Labels come from the original paper, McLeod et al. 2023 (PLoS One 18:e0280211),
# S1 Table: RRC_ID (= SRA SampleName AML01-AML83) and MCI (Y -> MCI, N -> NC) = 30 / 30, as in the paper.

project: PRJNA801673

expected:
  runs: 60
  groups: {MCI: 30, NC: 30}

labels:
  file: labels/PRJNA801673.csv
  join_column: SampleName
  source_column: Diagnosis
  unique_column: SampleName      # one run per sample
  regex: '^(MCI|NC)$'

selection_seed: 20261011

modes:
  dry-run: {n_samples: 2, subsample_pairs: 5000, n_reads_learn: 10000}
  validation: {n_samples: 10}
  full: {}

# Verified in raw reads (2 x 153): 515F on R1 and 806R on R2 at position 0.
# Reference numbers of the committed results. A run that matches logs
# REPRODUCIBILITY CHECK PASSED (the pipeline is deterministic for identical input).
expected_results:
  full:                        # 2026-11-09 run, QIIME 2 2026.7, FIGARO trunc 133/132, maxEE 1/1; = results/PRJNA801673/full
    asvs: 2609
    total_input: 3878947
    total_non_chimeric: 2993806

primers:
  r1: GTGYCAGCMGCCGCGGTAA      # 515F
  r2: GGACTACHVGGGTWTCTAAT     # 806R

cutadapt: {error_rate: 0.1, min_overlap: 15}

dada2:
  truncation: figaro
  max_ee_f: 4
  max_ee_r: 6
  n_reads_learn: 100000

expected_insert_upper: 253
min_paired_overlap: 12         # 2 x 153 reads leave at most ~14 bp overlap; DADA2's minimum is 12

qc: {min_cutadapt_retained: 0.80, min_trunc_eligible: 0.95, min_dada2_retained_pct: 20}
reference: {silva_version: "138", silva_target: SSURef_NR99}
vsearch: {identity: 0.90, query_coverage: 0.80, maxaccepts: 10}
genus_filter: {min_samples_present: 2, min_corpus_fraction: 0.00001}

figaro: {amplicon_length: 253, forward_primer_length: 19, reverse_primer_length: 20, min_overlap: 12}

download: {max_size: 20G, parallel_jobs: 4, delete_sra_after_fastq: true}

warnings:
  - Labels from McLeod et al. 2023 S1 Table (labels/PRJNA801673.csv), not from NCBI
  - Short reads (2 x 153): small read-pair overlap

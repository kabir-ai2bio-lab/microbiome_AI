# 16S amplicon preprocessing config for PRJNA554111 (Chongqing, China; AD vs NC).
# Dataset #5 of Wang et al. 2026 (mSystems 11:e01754-25), Table 1: 43 AD / 43 NC, V3-V4, paired.

project: PRJNA554111

expected:
  paired_runs: 86
  groups: {AD: 43, NC: 43}

labels:                        # SampleName is AD<n> / CON<n>
  source_column: SampleName
  regex: '^(AD|CON)\d+$'
  map: {CON: NC}

selection_seed: 20261011

modes:
  dry-run:
    n_samples: 2               # one AD + one NC
    subsample_pairs: 5000
    n_reads_learn: 10000
  validation:
    n_samples: 10
  full: {}

# Reference numbers (2026-11-02, QIIME 2 2026.7, FIGARO trunc 265/184, maxEE 2/1).
expected_results:
  dry-run:
    asvs: 146
    non_chimeric: {SRR9671477: 4045, SRR9671520: 3403}

primers:                       # verified in raw reads: 338F on R1, 806R on R2, each after a 6 bp spacer
  r1: ACTCCTACGGGAGGCAGCAG     # 338F
  r2: GGACTACHVGGGTWTCTAAT     # 806R

cutadapt:
  error_rate: 0.1
  min_overlap: 15

dada2:                         # post-Cutadapt coordinates (2 x 301 bp reads, ~275 bp after trimming)
  truncation: figaro           # truncation lengths + maxEE = FIGARO's best choice, as in the paper
  max_ee_f: 4                  # max_ee_* are used only with 'truncation: config'
  max_ee_r: 6
  n_reads_learn: 100000

expected_insert_upper: 429     # 338F-806R insert, as in PRJNA496408
min_paired_overlap: 20

qc:
  min_cutadapt_retained: 0.80
  min_trunc_eligible: 0.95
  min_dada2_retained_pct: 20

reference:
  silva_version: "138"
  silva_target: SSURef_NR99

vsearch:
  identity: 0.90
  query_coverage: 0.80
  maxaccepts: 10

genus_filter:
  min_samples_present: 2
  min_corpus_fraction: 0.00001

figaro:                        # primer lengths include the 6 bp spacer
  amplicon_length: 429
  forward_primer_length: 26
  reverse_primer_length: 26
  min_overlap: 20

download:
  max_size: 20G
  parallel_jobs: 4
  delete_sra_after_fastq: true

warnings:
  - Labels inferred from NCBI SampleName prefixes (AD / CON); not clinically verified
  - Single BioProject; cross-study batch correction happens after merging
